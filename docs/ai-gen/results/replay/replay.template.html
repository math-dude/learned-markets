<title>Learned Markets Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one stage. Scene tabs on top, a wide chart with two live readouts beside it, transport underneath. */
:root {
  --bg: #fcfcfb; --panel: #f3f2ee; --line: #e2e0d9; --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #807e77;
  --ours: #2a78d6; --pump: #eb6834; --band: #efede6;
  --display: "Familjen Grotesk", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1a19; --panel: #242422; --line: #383734; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8d84;
  --ours: #3987e5; --pump: #d95926; --band: #2a2927; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1a1a19; --panel: #242422; --line: #383734; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8d84;
  --ours: #3987e5; --pump: #d95926; --band: #2a2927; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 3vw, 2.1rem); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.tabs, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button, .chips button, .transport button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.tabs button { font-weight: 600; }
.chips button { padding: 5px 12px; font-size: 0.875rem; color: var(--ink-2); }
.tabs button[aria-selected="true"], .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ours); outline-offset: 2px; }
.scene-head h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.25rem, 2.4vw, 1.7rem); margin: 0 0 4px; text-wrap: balance; }
.scene-head p { margin: 0; color: var(--ink-2); max-width: 68ch; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; align-items: stretch; }
.chart { min-width: 0; position: relative; }
.chart svg { display: block; width: 100%; height: auto; touch-action: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.875rem; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.key { width: 22px; height: 0; border-top: 3px solid var(--c); border-radius: 2px; }
.key.dash { border-top: 2px dashed var(--ink-2); }
.readouts { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.readout { background: var(--panel); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; flex: 1; justify-content: center; }
.readout .who { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.readout .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: clamp(1.7rem, 3.2vw, 2.4rem); line-height: 1.1; }
.readout .what { color: var(--ink-2); font-size: 0.875rem; }
.plays { display: flex; flex-direction: column; gap: 12px; }
.playhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.playhead b { font-family: var(--display); font-size: 1.15rem; }
.playhead span { color: var(--ink-2); font-family: var(--mono); font-size: 0.9rem; }
.duel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.side { border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.side h3 { margin: 0; font-size: 1rem; font-weight: 600; }
.side ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.side li { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 10px; }
.side li i { font-style: normal; color: var(--ink-3); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 3px; }
.side li span { font-variant-numeric: tabular-nums; }
.side .why { background: var(--panel); border-radius: 6px; padding: 10px 12px; font-size: 0.95rem; margin-top: 2px; }
.side .why b { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin-bottom: 2px; }
@media (max-width: 760px) { .duel { grid-template-columns: minmax(0, 1fr); } }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.transport button.play { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; min-width: 108px; }
.transport input[type="range"] { flex: 1; min-width: 160px; accent-color: var(--ink); }
.clock { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 9ch; text-align: right; }
.takeaway { font-size: 1.08rem; max-width: 70ch; margin: 0; }
.fine { color: var(--ink-3); font-size: 0.85rem; margin: 0; max-width: 90ch; }
details { color: var(--ink-2); font-size: 0.9rem; }
details .scroll { overflow-x: auto; }
table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.8rem; padding: 6px 9px; border-radius: 6px;
  line-height: 1.35; white-space: nowrap; transform: translate(-50%, -110%); font-variant-numeric: tabular-nums; }
svg text { font-family: var(--body); fill: var(--ink-2); font-size: 12px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .band { fill: var(--band); }
svg .bandlabel { fill: var(--ink-3); font-size: 11px; }
@media (max-width: 760px) { .stage { grid-template-columns: minmax(0, 1fr); } .readouts { flex-direction: row; } .readout { padding: 10px 12px; } }
</style>

<div class="wrap">
  <header>
    <h1>Learned Markets Replay</h1>
    <p>The same simulated crowd, on pump.fun's curve and on our market.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Scenes" id="tabs"></div>
  <div class="scene-head"><h2 id="title"></h2><p id="lede"></p></div>
  <div class="chips" id="chips" hidden></div>
  <div class="plays" id="plays" hidden>
    <div class="playhead"><b id="playtitle"></b><span id="playclock"></span></div>
    <div class="duel">
      <section class="side" style="--c:var(--pump)"><h3>On pump.fun's curve</h3><ol id="play-pump"></ol><div class="why" id="why-pump"></div></section>
      <section class="side" style="--c:var(--ours)"><h3>On our market</h3><ol id="play-ours"></ol><div class="why" id="why-ours"></div></section>
    </div>
  </div>
  <div class="stage">
    <div class="chart" id="chart">
      <div class="legend" id="legend"></div>
      <svg id="svg" role="img" aria-labelledby="title"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="readouts" id="readouts"></div>
  </div>
  <div class="transport">
    <button id="back" type="button" hidden>Back</button>
    <button id="next" type="button" hidden>Next</button>
    <button class="play" id="play" type="button">Replay</button>
    <input id="scrub" type="range" min="0" max="1000" value="1000" aria-label="Position in the replay">
    <span class="clock" id="clock"></span>
  </div>
  <p class="takeaway" id="takeaway"></p>
  <details><summary>Numbers behind this scene</summary><div class="scroll" id="table"></div></details>
  <p class="fine" id="fine"></p>
</div>

<script>
const D = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const pct = (v, d = 0) => v.toFixed(d) + "%";
const mult = (v) => (v >= 10 ? v.toFixed(0) : v.toFixed(2)) + "x";
const sol = (v, d = 2) => (v > 0 ? "+" : "") + v.toFixed(d) + " SOL";
const off = (p, v) => { const r = p / v - 1; return (r >= 0 ? "+" : "") + (r * 100).toFixed(0) + "%"; };

const MONEY = {
  retail: { chip: "Retail profit", what: "average retail trader, so far", fmt: (v) => sol(v), axis: (v) => v.toFixed(1),
    take: "The average retail trader loses 0.40 SOL on pump's curve and 0.15 SOL on ours over the same five and a half hours." },
  dead: { chip: "Lost in dead coins", what: "money stuck in coins that died", fmt: (v) => v.toFixed(0) + " SOL", axis: (v) => v.toFixed(0),
    take: "When a coin dies, holders' money dies with it. On pump's curve that adds up to 386 SOL; on ours, 175." },
  top10: { chip: "Top-10 holders", what: "share of supply held by ten wallets", fmt: (v) => pct(v, 1), axis: (v) => v.toFixed(0) + "%",
    take: "Ten wallets hold about 15% of a typical coin on pump's curve and about 6% on ours." },
  fees: { chip: "Fees earned", what: "trading fees collected so far", fmt: (v) => v.toFixed(0) + " SOL", axis: (v) => v.toFixed(0),
    take: "The exchange collects more in fees on our market (104 SOL against 71) while traders lose less." },
};

const tok = (n) => (n / 1e6).toFixed(n < 1e6 ? 2 : 1) + "M";
const share = (n) => (n / 1e7).toFixed(n < 1e7 ? 2 : 1) + "%";
const signed = (v) => (v >= 0 ? "+" : "") + (v * 100).toFixed(0) + "%";

// One play = one 10-second batch in which the wallet acted. Each side gets four lines and a reason.
function describe(r, mine, other) {
  if (!r) return { lines: [["Order", "Nothing left to do"], ["Result", "Already out of the coin"]], why: ["", ""] };
  const L = [];
  if (r.side === "buy") {
    L.push(["Order", "Bids for " + tok(r.asked) + " tokens, " + share(r.asked) + " of the coin, at any price"]);
    if (mine === "pump") L.push(["Market", r.accepted >= r.asked ? "Takes the whole order" : r.accepted <= 1 ? "Wallet is out of money" : "Wallet can only afford " + tok(r.accepted)]);
    else L.push(["Market", r.accepted === 0 ? "Refuses it: the wallet is at the holding cap" : r.accepted < r.asked ? "Cuts it to " + tok(r.accepted) + " before the auction runs (cap " + share(r.cap) + " per person)" : "Accepts it in full"]);
    L.push(["Fill", r.got > 0 ? "Buys " + tok(r.got) + " for " + r.cash.toFixed(2) + " SOL" + (mine === "ours" && r.got < r.accepted ? ", sharing the batch with " + Math.max(r.others - 1, 0) + " other traders" : "") : "Buys nothing"]);
    L.push(["After", "Price " + signed(r.price_move) + " this batch. Wallet holds " + share(r.holds)]);
  } else {
    L.push(["Order", "Offers all " + tok(r.asked) + " tokens for sale at any price"]);
    L.push(["Market", r.got >= r.asked ? "Sells all of it" : "Sells " + tok(r.got) + " of it"]);
    L.push(["Fill", "Receives " + (-r.cash).toFixed(2) + " SOL after a " + (r.fee_rate * 100).toFixed(0) + "% exit fee"]);
    L.push(["After", "Price " + signed(r.price_move) + " this batch. Wallet holds " + share(r.holds)]);
  }
  let why;
  if (mine === "pump") why = r.side === "buy"
    ? ["Why nothing stops it", r.accepted <= 1 ? "The only limit on a buyer is their own money." : "Nothing limits one buyer, so each order drags the price further up the curve."]
    : ["Why nothing stops it", "Exit costs a flat 1% however fast you leave, and every sale pushes the price down for whoever is still holding."];
  else if (r.side === "sell") why = ["Rule that bites: early-exit fee", "Selling soon after buying costs more. This wallet paid " + (r.fee_rate * 100).toFixed(0) + "% to leave, against 1% on pump."];
  else if (r.accepted < r.asked) why = ["Rule that bites: holding cap", "One verified person is one wallet and may hold about 2% of a coin, so the order is cut before it can touch the price." +
    (r.got < r.accepted && r.got > 0 ? " What is left clears in a 10-second batch at one price for everyone, so being first buys nothing." : "")];
  else why = ["Rule that bites: one price per batch", "Everyone who bids in the same 10 seconds pays the same price and shares the supply."];
  return { lines: L, why };
}

function playScene(id, tab, title, lede, key, metric, axis, readWhat, take) {
  const P = D.plays[key], ts = [...new Set([...P.pump, ...P.ours].map((r) => r.t))].sort((a, b) => a - b);
  const at = (rows, t) => rows.find((r) => r.t === t) || null;
  const carry = (rows) => { let lastV = metric === "price" ? 1 : 0; return ts.map((t) => { const r = at(rows, t); if (r) lastV = metric === "price" ? r.price : r.holds / 1e7; return lastV; }); };
  const sc = { id, tab, title, lede, scale: metric === "price" ? "log" : "linear", zero: metric !== "price", axis, isPlay: true,
    x: ts.map((t) => t / 6), steps: ts.map((t) => ({ t, pump: at(P.pump, t), ours: at(P.ours, t) })),
    series: [{ k: "pump", v: carry(P.pump) }, { k: "ours", v: carry(P.ours) }] };
  sc.read = (s, i) => ({ num: axis(metric === "price" ? Math.max(...s.v.slice(0, i + 1)) : s.v[i]), what: readWhat });
  sc.take = take;
  return sc;
}

function scenes() {
  const w = D.whale, p = D.pnd, last = (rows) => rows[rows.length - 1];
  return [
    playScene("whale", "Whale", "A whale tries to buy an entire coin",
      "One wallet with 50 SOL bids for 3% of a new coin every 10 seconds. Step through what each market does with every order.",
      "whale", "holds", (v) => v.toFixed(1) + "%", "of the coin held by this wallet",
      () => "After two minutes the wallet owns " + share(last(D.plays.whale.pump).holds) + " of the coin on pump's curve and has multiplied its price. On our market it holds " +
        share(last(D.plays.whale.ours).holds) + " and the price has not moved. Across 32 runs the largest holder ends at " + w.pump[w.pump.length - 1].toFixed(0) + "% on pump and " + w.ours[w.ours.length - 1].toFixed(0) + "% on ours."),
    { id: "meme", tab: "Same meme", title: "", lede: "", chips: D.memes.map((m) => m.title), pick: 1, scale: "log", axis: mult, build(sc) {
        const m = D.memes[sc.pick];
        sc.title = m.title; sc.x = m.minutes;
        sc.lede = "One meme, traded by the same crowd on both markets. The dashed line is how much real interest the meme has, which no trader sees directly.";
        sc.series = [{ k: "interest", v: m.interest }, { k: "pump", v: m.pump }, { k: "ours", v: m.ours }];
        sc.read = (s, i) => ({ num: off(s.v[i], m.interest[i]), what: "price against real interest, now" });
        sc.take = () => "Over this meme's life the price sat " + (m.pump_off * 100).toFixed(0) + "% away from real interest on pump's curve and " +
          (m.ours_off * 100).toFixed(0) + "% away on ours. Ours was closer for " + (m.ours_closer_share * 100).toFixed(0) + "% of the " + m.memes + " memes of this kind.";
      } },
    playScene("pump-and-dump", "Pump and dump", "A wallet pumps a coin, then dumps it",
      "It buys as hard as it can for two and a half minutes, waits, then sells everything at any price. Step through each order.",
      "pnd", "price", mult, "highest price so far, as a multiple of launch",
      () => "On pump's curve the wallet takes " + share(Math.max(...D.plays.pnd.pump.map((r) => r.holds))) + " of the coin, the price climbs 20 to 40% a batch and then falls about 45% a batch on the way out. On ours it tops out at " +
        share(Math.max(...D.plays.pnd.ours.map((r) => r.holds))) + " and pays a " + (Math.max(...D.plays.pnd.ours.map((r) => r.fee_rate)) * 100).toFixed(0) +
        "% exit fee. This wallet ended " + sol(last(D.plays.pnd.pump).wealth, 1) + " on pump and " + sol(last(D.plays.pnd.ours).wealth, 2) +
        " on ours, where the coin had risen on other people's buying. Across 32 runs the pumped coin peaks at " + p.peak_pump_median + "x launch on pump and " + p.peak_ours_median + "x on ours."),
    { id: "money", tab: "Who keeps the money", title: "Where the money ends up", chips: Object.values(MONEY).map((m) => m.chip), pick: 0, scale: "linear", build(sc) {
        const key = Object.keys(MONEY)[sc.pick], m = MONEY[key];
        sc.lede = "A full market for five and a half hours: launches, a line of new coins, cuts, and a mix of attackers. Same crowd on both.";
        sc.x = D.money.pump.minutes; sc.axis = m.axis; sc.zero = true;
        sc.series = [{ k: "pump", v: D.money.pump[key] }, { k: "ours", v: D.money.ours[key] }];
        sc.read = (s, i) => ({ num: m.fmt(s.v[i]), what: m.what });
        sc.take = () => m.take;
      } },
  ];
}
const NAME = { pump: "pump.fun curve", ours: "Our market", interest: "Real interest (hidden)" };
const SC = scenes();
let cur = 0, pos = 1, playing = false, raf = 0, last = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function setScene(i, keepPos) {
  cur = i; const sc = SC[cur];
  if (sc.build) sc.build(sc);
  [...$("tabs").children].forEach((b, j) => b.setAttribute("aria-selected", j === cur));
  $("title").textContent = sc.title; $("lede").textContent = sc.lede;
  const chips = $("chips"); chips.hidden = !sc.chips; chips.replaceChildren();
  (sc.chips || []).forEach((label, j) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", j === sc.pick);
    b.onclick = () => { sc.pick = j; stop(); pos = 1; setScene(cur, true); }; chips.append(b);
  });
  $("legend").replaceChildren(...sc.series.map((s) => {
    const el = document.createElement("span"), key = document.createElement("i");
    key.className = "key" + (s.k === "interest" ? " dash" : ""); key.style.setProperty("--c", "var(--" + s.k + ")");
    el.append(key, NAME[s.k]); return el;
  }));
  $("readouts").replaceChildren(...sc.series.filter((s) => s.k !== "interest").map((s) => {
    const el = document.createElement("div"); el.className = "readout"; el.dataset.k = s.k;
    el.innerHTML = '<div class="who"><i class="dot" style="--c:var(--' + s.k + ')"></i>' + NAME[s.k] + '</div><div class="num"></div><div class="what"></div>';
    return el;
  }));
  const rows = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(f * (sc.x.length - 1)));
  $("table").innerHTML = "<table><tr><th>Minute</th>" + sc.series.map((s) => "<th>" + NAME[s.k] + "</th>").join("") + "</tr>" +
    rows.map((i) => "<tr><td>" + sc.x[i].toFixed(0) + "</td>" + sc.series.map((s) => "<td>" + sc.axis(s.v[i]) + "</td>").join("") + "</tr>").join("") + "</table>";
  const play = !!sc.isPlay;
  $("plays").hidden = !play; $("back").hidden = !play; $("next").hidden = !play;
  $("scrub").max = play ? sc.steps.length - 1 : 1000; $("scrub").step = 1;
  if (!keepPos) pos = play ? 0 : 1;
  draw();
}

function drawPlay(sc, idx) {
  const st = sc.steps[idx], secs = st.t * 10;
  $("playtitle").textContent = "Play " + (idx + 1) + " of " + sc.steps.length;
  $("playclock").textContent = Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") + " after launch";
  for (const side of ["pump", "ours"]) {
    const d = describe(st[side], side, st[side === "pump" ? "ours" : "pump"]);
    $("play-" + side).replaceChildren(...d.lines.map(([k, v]) => { const li = document.createElement("li"), a = document.createElement("i"), b = document.createElement("span"); a.textContent = k; b.textContent = v; li.append(a, b); return li; }));
    const why = $("why-" + side); why.hidden = !d.why[0]; why.replaceChildren();
    if (d.why[0]) { const b = document.createElement("b"); b.textContent = d.why[0]; why.append(b, d.why[1]); }
  }
}

let G = null;
function draw() {
  const sc = SC[cur], svg = $("svg"), W = Math.max(320, $("chart").clientWidth), H = Math.round(Math.min(460, Math.max(260, W * 0.5)));
  const m = { l: 52, r: 18, t: 14, b: 34 }, x0 = sc.x[0], x1 = sc.x[sc.x.length - 1];
  const all = sc.series.flatMap((s) => s.v); let lo = Math.min(...all), hi = Math.max(...all);
  const log = sc.scale === "log";
  if (log) { lo = Math.log(lo * 0.85); hi = Math.log(hi * 1.15); } else { if (sc.zero) { lo = Math.min(0, lo); hi = Math.max(0, hi); } const pad = (hi - lo) * 0.08 || 1; hi += pad; if (lo < 0) lo -= pad; }
  const X = (v) => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = (v) => H - m.b - ((log ? Math.log(v) : v) - lo) / (hi - lo) * (H - m.t - m.b);
  let ticks = [];
  if (log) { for (let e = -3; e <= 3; e++) for (const k of [1, 2, 5]) { const t = k * 10 ** e; if (Math.log(t) >= lo && Math.log(t) <= hi) ticks.push(t); } if (ticks.length > 7) ticks = ticks.filter((_, i) => i % 2 === 0); }
  else { const step = [1, 2, 5, 10, 20, 50, 100, 200].map((s) => s * 10 ** Math.floor(Math.log10((hi - lo) / 5))).find((s) => (hi - lo) / s <= 6) || (hi - lo) / 5; for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) ticks.push(Math.abs(t) < 1e-9 ? 0 : t); }
  const xt = []; const xs = [5, 10, 20, 30, 50, 60, 100].find((s) => (x1 - x0) / s <= 7) || 100; for (let t = Math.ceil(x0 / xs) * xs; t <= x1; t += xs) xt.push(t);
  const n = sc.x.length, idx = Math.min(n - 1, Math.round(pos * (n - 1))), px = X(sc.x[idx]);
  let h = '<defs><clipPath id="reveal"><rect x="0" y="0" width="' + (px + 1) + '" height="' + H + '"/></clipPath></defs>';
  for (const b of sc.bands || []) h += '<rect class="band" x="' + X(b.a) + '" y="' + m.t + '" width="' + (X(b.b) - X(b.a)) + '" height="' + (H - m.t - m.b) + '"/><text class="bandlabel" x="' + (X(b.a) + 5) + '" y="' + (m.t + 14) + '">' + b.label + '</text>';
  for (const t of ticks) h += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text x="' + (m.l - 8) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + sc.axis(t) + '</text>';
  for (const t of xt) h += '<text x="' + X(t) + '" y="' + (H - m.b + 18) + '" text-anchor="middle">' + t + '</text>';
  h += '<text x="' + (W - m.r) + '" y="' + (H - 2) + '" text-anchor="end">minutes</text>';
  for (const s of sc.series) {
    const path = s.v.map((v, i) => (i ? "L" : "M") + X(sc.x[i]).toFixed(1) + " " + Y(v).toFixed(1)).join("");
    const dash = s.k === "interest" ? ' stroke-dasharray="5 4" stroke="var(--ink-2)" stroke-width="1.6"' : ' stroke="var(--' + s.k + ')" stroke-width="2.4"';
    h += '<path d="' + path + '" fill="none" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#reveal)"' + dash + '/>';
  }
  for (const s of sc.series) if (s.k !== "interest") h += '<circle cx="' + px + '" cy="' + Y(s.v[idx]) + '" r="5" fill="var(--' + s.k + ')" stroke="var(--bg)" stroke-width="2"/>';
  h += '<line id="cross" x1="0" x2="0" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/>';
  svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.innerHTML = h;
  G = { sc, X, m, W, x0, x1, n };
  for (const s of sc.series) { const el = $("readouts").querySelector('[data-k="' + s.k + '"]'); if (!el) continue; const r = sc.read(s, idx); el.querySelector(".num").textContent = r.num; el.querySelector(".what").textContent = r.what; }
  if (sc.isPlay) { drawPlay(sc, idx); $("scrub").value = idx; $("clock").textContent = ""; }
  else { $("scrub").value = Math.round(pos * 1000); $("clock").textContent = "minute " + sc.x[idx].toFixed(0); }
  $("takeaway").textContent = sc.take(idx);
  $("play").textContent = playing ? "Pause" : (pos >= 1 ? "Replay" : sc.isPlay ? "Auto-play" : "Play");
  if (sc.isPlay) { $("back").disabled = idx === 0; $("next").disabled = idx === n - 1; }
}

function stepTo(i) { const n = SC[cur].steps.length; pos = Math.min(n - 1, Math.max(0, i)) / (n - 1); draw(); }
function stepNow() { return Math.round(pos * (SC[cur].steps.length - 1)); }
function tick(now) {
  if (!playing) return;
  if (SC[cur].isPlay) { if (now - last > 2200) { last = now; stepTo(stepNow() + 1); } }
  else { pos = Math.min(1, pos + (now - last) / 9000); last = now; draw(); }
  if (pos >= 1) { playing = false; draw(); return; }
  raf = requestAnimationFrame(tick);
}
function stop() { playing = false; cancelAnimationFrame(raf); }
function play() { if (pos >= 1) pos = 0; if (reduce) { pos = 1; draw(); return; } playing = true; last = performance.now(); raf = requestAnimationFrame(tick); draw(); }

SC.forEach((sc, i) => {
  const b = document.createElement("button"); b.type = "button"; b.role = "tab"; b.textContent = sc.tab;
  b.onclick = () => { stop(); setScene(i); try { history.replaceState(null, "", "#" + sc.id); } catch (e) {} };
  $("tabs").append(b);
});
$("play").onclick = () => (playing ? (stop(), draw()) : play());
$("scrub").oninput = (e) => { stop(); if (SC[cur].isPlay) stepTo(+e.target.value); else { pos = e.target.value / 1000; draw(); } };
$("back").onclick = () => { stop(); stepTo(stepNow() - 1); };
$("next").onclick = () => { stop(); stepTo(stepNow() + 1); };
document.addEventListener("keydown", (e) => {
  if (SC[cur].isPlay && e.target.tagName !== "INPUT" && (e.code === "ArrowRight" || e.code === "ArrowLeft")) { e.preventDefault(); stop(); stepTo(stepNow() + (e.code === "ArrowRight" ? 1 : -1)); }
  if (e.code === "Space" && e.target.tagName !== "BUTTON" && e.target.tagName !== "INPUT") { e.preventDefault(); $("play").click(); }
});
$("svg").addEventListener("pointermove", (e) => {
  if (!G) return; const box = $("svg").getBoundingClientRect(), k = G.W / box.width, vx = (e.clientX - box.left) * k;
  const f = Math.min(1, Math.max(0, (vx - G.m.l) / (G.W - G.m.l - G.m.r))), i = Math.round(f * (G.n - 1));
  if (i > Math.round(pos * (G.n - 1))) return hideTip();
  const cross = document.getElementById("cross"); cross.setAttribute("x1", G.X(G.sc.x[i])); cross.setAttribute("x2", G.X(G.sc.x[i])); cross.setAttribute("visibility", "visible");
  const tip = $("tip"); tip.hidden = false;
  tip.innerHTML = "<b>minute " + G.sc.x[i].toFixed(0) + "</b><br>" + G.sc.series.map((s) => NAME[s.k] + ": " + G.sc.axis(s.v[i])).join("<br>");
  tip.style.left = Math.min(box.width - 90, Math.max(90, G.X(G.sc.x[i]) / k)) + "px"; tip.style.top = (e.clientY - box.top + $("svg").offsetTop - 8) + "px";
});
function hideTip() { $("tip").hidden = true; const c = document.getElementById("cross"); if (c) c.setAttribute("visibility", "hidden"); }
$("svg").addEventListener("pointerleave", hideTip);
addEventListener("resize", draw);
$("fine").textContent = "Everything here is a simulation: 512 simulated traders per world, calibrated on a month of pump.fun trading. The whale, same-meme and pump-and-dump scenes use six established coins per world with no launch queue, which is the setting most favourable to our market. The whale and pump-and-dump scenes follow one wallet through one run, with every number taken from that run; the 32-run figures in the text are medians.";
const start = SC.findIndex((s) => "#" + s.id === location.hash);
setScene(start < 0 ? 0 : start);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>
