[package]
name = "learned-markets"
version = "0.1.0"
description = "Learned Markets participant registry, gated intents, and settlement scaffold"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "learned_markets"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
solana-attestation = "=2.0.0"
solana-sha256-hasher = "3"
spl-token-interface = "=2.0.0"
spl-token-2022-interface = "=4.0.0"
spl-token-metadata-interface = "=1.0.1"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
