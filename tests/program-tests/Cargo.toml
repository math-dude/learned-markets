# Separate workspace: litesvm pins solana-address ~2.7 while solana-attestation
# (used by the program crate) needs ^2.8, so this harness never links the
# program crate. It loads the compiled .so files and encodes instructions itself.
[workspace]

[package]
name = "program-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
litesvm = "=0.18.2"
solana-account = "4.3"
solana-clock = "~3.2.0"
solana-instruction = "~3.5.0"
solana-keypair = "3.1"
solana-message = "4.2"
solana-address = { version = "~2.7.0", features = ["borsh"] }
solana-signer = "3.0"
solana-transaction = "4.1"
solana-transaction-error = "~3.4.0"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"
serde_json = "1"

[features]
demo-credit = []
