[project]
name = "learned-markets"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/simulation",
    "packages/training",
    "apps/backend",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E731"]
